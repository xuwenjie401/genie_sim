      "radius": 0.01
  - right_gripper_base_link:
    - "center": [0.0, 0.0, 0.0]
      "radius": 0.05
  - right_gripper_l_knuckle_link:
    - "center": [0.0, 0.0, 0.0]
      "radius": 0.005
  - right_gripper_l_inner_knuckle_link:
